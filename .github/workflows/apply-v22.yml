name: Apply v2.2 payload

on:
  push:
    branches:
      - refactor/pudding-skill-v2.2

permissions:
  contents: write

concurrency:
  group: apply-v22
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pudding-skill-v2.2
      - name: Rebuild and verify payload
        run: |
          cat .v22chunks/*.txt > .v2.2-payload.b64
          echo 'c1d01082c8acfaa48a8bdf588f86403a81c3c5b4f247ed68e85b9d381535732b  .v2.2-payload.b64' | sha256sum -c -
          base64 --decode .v2.2-payload.b64 > .v2.2-payload.tgz.clean
          echo 'fa13b5395f6d752c94d319a5cdd63f961044777d0c9fa54820d7e503e787e3c9  .v2.2-payload.tgz.clean' | sha256sum -c -
          tar -xzf .v2.2-payload.tgz.clean
          rm -f .v2.2-payload.tgz .v2.2-payload.tgz.clean .v2.2-payload.b64 .v2.2-test .v22-trigger
          rm -rf .v22chunks
          rm .github/workflows/apply-v22.yml
          npm install --package-lock-only --ignore-scripts
      - name: Verify v2.2 before commit
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/qa_story.py --root .
      - name: Commit v2.2
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "v2.2: add candidate ranking and claim-audited editorial pipeline"
          git push origin HEAD:refactor/pudding-skill-v2.2
