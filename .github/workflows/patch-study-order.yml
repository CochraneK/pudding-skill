name: Patch Pudding gate order

on:
  push:
    branches: [feat/pudding-study-corpus]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pudding-study-corpus
          fetch-depth: 0
      - name: Reorder gate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('SKILL.md')
          text = path.read_text(encoding='utf-8')
          old = '''0. **Research when data is missing** — if the input is a domain/industry question rather than a trustworthy dataset, build a research dossier first: definitions → source map → primary evidence → numeric claims → conflict resolution → data acquisition plan. Do not invent a dataset to skip this step.\n1. **Audit input** — inspect fields, types, missingness, duplicates, ranges, units, analytical grain, and source limitations.\n2. **Resolve semantics** — use a data contract when roles/units are ambiguous. Never infer meaning from field names alone when that could change the claim.\n3. **Gate the concept** — when the work starts from a broad topic or ambitious bespoke story, run the Pudding DNA gate before expensive research/production. The valid result may be `CONTINUE`, `PIVOT`, `PIVOT_NONVISUAL`, or `PUT_DOWN`; the workflow is not required to ship a visual story.\n'''
          new = '''0. **Gate the concept when needed** — when work starts from a broad topic or ambitious bespoke story, run the Pudding DNA gate before expensive research/production. The valid result may be `CONTINUE`, `PIVOT`, `PIVOT_NONVISUAL`, or `PUT_DOWN`; the workflow is not required to ship a visual story.\n1. **Research when data is missing** — if the surviving concept lacks a trustworthy dataset, build a research dossier: definitions → source map → primary evidence → numeric claims → conflict resolution → data acquisition plan. Do not invent a dataset to skip this step.\n2. **Audit input** — inspect fields, types, missingness, duplicates, ranges, units, analytical grain, and source limitations.\n3. **Resolve semantics** — use a data contract when roles/units are ambiguous. Never infer meaning from field names alone when that could change the claim.\n'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/patch-study-order.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SKILL.md .github/workflows/patch-study-order.yml
          git commit -m "docs: gate broad concepts before research"
          git push origin HEAD:feat/pudding-study-corpus
