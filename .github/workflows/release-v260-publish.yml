name: Publish v2.6.0

on:
  push:
    branches: [release/v2.6.0]

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.6.0
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.6.0 >/dev/null 2>&1 || gh release create v2.6.0 \
            --target 232740333a95260b99e79d049a023f401d51e65a \
            --title "v2.6.0 — Editorial benchmark and self-improvement corpus" \
            --notes $'v2.6.0 adds a deterministic 12-case editorial regression corpus across CSV, TSV, JSON, JSONL, and NDJSON.\n\nHighlights:\n- five separately scored dimensions: story selection, visual grammar, independent claim audit, editorial/renderer gate, and first-draft provenance\n- strict 100/100 regression baseline with 12/12 case pass and no hard failures\n- /benchmark dashboard plus benchmark JSON/Markdown QA evidence\n- browser/visual QA expanded to /benchmark (8/8 browser cases; 16 top/mid screenshots)\n- benchmark-discovered fixes for semantic label token replacement and grouped-change visual grammar\n- 27 regression/unit tests passing\n- high/critical dependency gate remains green\n\nThe benchmark is a regression instrument, not a score for newsworthiness, causal validity, prose craft, or aesthetic taste.'
      - name: Remove one-shot publisher
        run: |
          git rm .github/workflows/release-v260-publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove v2.6.0 release publisher"
          git push origin HEAD:release/v2.6.0
