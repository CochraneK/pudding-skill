name: Publish v2.4.0 release

on:
  push:
    branches: [release/v2.4.0]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target ee73dd255a7c9b33c32c56a9a5d79b8cbf007a40 \
            --title "v2.4.0 — Arbitrary data to publication-ready first draft" \
            --notes "Pudding-inspired editorial data-storytelling Agent Skill v2.4.0. Adds CSV/TSV/row-JSON/JSONL/NDJSON input support, a unified pudding CLI, richer visual-grammar recommendations with deterministic renderer fallback, and provenance-aware first-draft generation. The pipeline emits headline/dek/sections/annotations/methodology/caveats/sources plus claim_ref-to-evidence mappings after independent quantitative verification. Validation: 13 regression tests, production Svelte build, dependency high/critical gate, and 6/6 real-Chromium desktop/mobile delivery cases. Remaining npm audit baseline is 7 low advisories with no safe non-breaking automated remediation."
      - name: Remove one-shot publisher from release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v240-release.yml
          git commit -m "chore: remove one-shot v2.4.0 publisher"
          git push
