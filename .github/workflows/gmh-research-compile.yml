name: Compile global mental health research dossier

on:
  push:
    branches: [story/global-mental-health-research]

permissions:
  contents: write

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/global-mental-health-research
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate research dossier
        run: python scripts/pudding.py research validate stories/global-mental-health/research/research-dossier.json
      - name: Compile research dossier
        run: python scripts/pudding.py research compile stories/global-mental-health/research/research-dossier.json --outdir stories/global-mental-health/research/compiled
      - name: Commit compiled research package and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gmh-research-compile.yml
          git add stories/global-mental-health/research/compiled
          git commit -m 'research: compile global mental health evidence package'
          git push
