name: Fix atlas Svelte runes
on:
  push:
    branches: [story/global-mental-health-capacity-atlas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate reactive state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/stories/global-mental-health/atlas/+page.svelte')
          s=p.read_text()
          s=s.replace("\tlet selectedMetric = 'psychiatrists_per_100k';", "\tlet selectedMetric = $state('psychiatrists_per_100k');")
          s=s.replace('\t$: selectedMeta = meta(selectedMetric);', '\tlet selectedMeta = $derived(meta(selectedMetric));')
          s=s.replace('\t$: selectedSummary = summary(selectedMetric);', '\tlet selectedSummary = $derived(summary(selectedMetric));')
          s=s.replace('\t$: coveragePct = Math.round((selectedSummary.n / capacity.country_area_universe) * 100);', '\tlet coveragePct = $derived(Math.round((selectedSummary.n / capacity.country_area_universe) * 100));')
          s=s.replace('\t$: regionRows = capacity.region_summaries', '\tlet regionRows = $derived(capacity.region_summaries')
          old='\t\t.sort((a, b) => (b.metric.median ?? -Infinity) - (a.metric.median ?? -Infinity));\n\n\tconst mismatch = capacity.historical_mismatch_lens;'
          new='\t\t.sort((a, b) => (b.metric.median ?? -Infinity) - (a.metric.median ?? -Infinity));\n\t);\n\n\tconst mismatch = capacity.historical_mismatch_lens;'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/gmh-atlas-runes-fix.yml
          git add src/routes/stories/global-mental-health/atlas/+page.svelte
          git commit -m 'fix: use Svelte runes in mental-health atlas'
          git push
