name: Fix WHO country dimension pagination
on:
  push:
    branches: [story/global-mental-health-capacity-atlas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dimension handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/mental_health_story.py')
          s=p.read_text()
          s=s.replace('    page_size = 100\n    skip = 0\n', '    page_size = 100 if "$top=" in url else None\n    skip = 0\n')
          s=s.replace('        separator = "&" if "?" in url else "?"\n        page_url = f"{url}{separator}$skip={skip}"\n', '        separator = "&" if "?" in url else "?"\n        page_url = url if page_size is None else f"{url}{separator}$skip={skip}"\n')
          s=s.replace('        if len(page) < page_size:\n            break\n        skip += page_size\n', '        if page_size is None or len(page) < page_size:\n            break\n        skip += page_size\n')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/gmh-country-dimension-fix.yml
          git add scripts/mental_health_story.py
          git commit -m 'fix: read WHO country dimension without paging'
          git push
