name: One-shot interaction polish

on:
  push:
    branches: [feat/bilingual-pudding-interaction]
    paths:
      - .github/workflows/one-shot-interaction-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/bilingual-pudding-interaction
      - name: Polish guided and explorer interaction
        run: python scripts/patch_interaction_tmp.py
      - name: Remove temporary patch machinery and commit
        run: |
          rm .github/workflows/one-shot-interaction-polish.yml scripts/patch_interaction_tmp.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows/one-shot-interaction-polish.yml scripts/patch_interaction_tmp.py
          git commit -m "fix: polish interactive accessibility and semantics"
          git push origin HEAD:feat/bilingual-pudding-interaction
