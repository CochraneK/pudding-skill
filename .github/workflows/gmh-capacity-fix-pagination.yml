name: Fix WHO capacity pagination
on:
  push:
    branches: [story/global-mental-health-capacity-atlas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use conservative WHO OData page size
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/mental_health_story.py')
          text=p.read_text()
          old='?$top=10000'
          assert text.count(old) == 2, text.count(old)
          p.write_text(text.replace(old, '?$top=100'), encoding='utf-8')
          PY
      - name: Self-delete and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/gmh-capacity-fix-pagination.yml
          git add scripts/mental_health_story.py
          git commit -m 'fix: page WHO OData requests conservatively'
          git push
