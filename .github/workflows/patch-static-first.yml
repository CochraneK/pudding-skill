name: Patch static-first corpus diversity

on:
  push:
    branches: [feat/pudding-static-first]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pudding-static-first
          fetch-depth: 0
      - name: Patch corpus and validators
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          corpus_path = Path('benchmarks/pudding-study-corpus.json')
          corpus = json.loads(corpus_path.read_text(encoding='utf-8'))
          if not any(s.get('id') == 'outkast-in-charts' for s in corpus['stories']):
              corpus['stories'].append({
                  'id': 'outkast-in-charts',
                  'title': 'Outkast, in Charts',
                  'url': 'https://pudding.cool/2017/03/outkast',
                  'published_year': 2017,
                  'story_family': 'static_chart_essay',
                  'question': "What does Outkast’s history look like when lyrical themes, language, collaborators, and life events are treated as evidence?",
                  'argument_pattern': 'Build a portrait of one cultural subject through a sequence of focused charts and reported context rather than through one master interactive.',
                  'human_angle': 'The author’s fandom and curiosity about hip-hop history are explicit, so the charts answer specific questions about an artist rather than decorating a retrospective.',
                  'data_strategy': 'artist_specific_analysis_plus_reporting',
                  'visual_necessity': 'Multiple small, mostly static charts let different kinds of evidence—language, themes, geography, collaborators, and chronology—sit beside reported context without forcing one interaction model.',
                  'interaction_jobs': ['none'],
                  'interaction_mode': 'static_chart_sequence',
                  'design_move': 'Use a sequence of self-contained visuals, each paired with editorial interpretation, so the story can change visual form when the evidence changes.',
                  'caveat_mode': 'The piece distinguishes quantitative counts from interpretive cultural history and uses reported context where data alone cannot establish meaning.',
                  'editorial_lesson': 'Static charts are a first-class visual-story form: if each chart advances a distinct part of the argument, interactivity is optional rather than a marker of ambition.',
                  'anti_copy_note': 'Learn the chart-sequence discipline; do not copy the typography, chart styling, artist framing, or specific Outkast analysis.'
              })
          corpus_path.write_text(json.dumps(corpus, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          path = Path('scripts/pudding_corpus.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    modes: Counter[str] = Counter()\n', '    modes: Counter[str] = Counter()\n    static_stories = 0\n')
          old = '''        interaction_jobs = story.get("interaction_jobs")\n        if not isinstance(interaction_jobs, list) or not interaction_jobs:\n            errors.append(f"{sid}: interaction_jobs must be a non-empty list")\n        else:\n            for job in interaction_jobs:\n                if isinstance(job, str) and job.strip():\n                    jobs[job.strip()] += 1\n                else:\n                    errors.append(f"{sid}: interaction job entries must be non-empty strings")\n'''
          new = '''        interaction_jobs = story.get("interaction_jobs")\n        if not isinstance(interaction_jobs, list) or not interaction_jobs:\n            errors.append(f"{sid}: interaction_jobs must be a non-empty list; use ['none'] for an intentionally static story")\n        else:\n            normalized_jobs = []\n            for job in interaction_jobs:\n                if isinstance(job, str) and job.strip():\n                    normalized = job.strip()\n                    normalized_jobs.append(normalized)\n                    jobs[normalized] += 1\n                else:\n                    errors.append(f"{sid}: interaction job entries must be non-empty strings")\n            if "none" in normalized_jobs:\n                if len(normalized_jobs) != 1:\n                    errors.append(f"{sid}: 'none' cannot be combined with interactive jobs")\n                static_stories += 1\n'''
          if old not in text:
              raise SystemExit('interaction block not found')
          text = text.replace(old, new)
          text = text.replace(
              '    if len(modes) < 6:\n        errors.append("corpus needs at least 6 distinct interaction modes")\n',
              '    if len(modes) < 6:\n        errors.append("corpus needs at least 6 distinct interaction modes")\n    if static_stories < 1:\n        errors.append("corpus needs at least one intentionally static story so Pudding-like does not imply interactive")\n'
          )
          text = text.replace(
              '        "interaction_modes": len(modes),\n',
              '        "interaction_modes": len(modes),\n        "static_stories": static_stories,\n'
          )
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_pudding_corpus.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              '        self.assertGreaterEqual(report["metrics"]["interaction_modes"], 6)\n',
              '        self.assertGreaterEqual(report["metrics"]["interaction_modes"], 6)\n        self.assertGreaterEqual(report["metrics"]["static_stories"], 1)\n'
          )
          test_path.write_text(test, encoding='utf-8')

          gate_path = Path('scripts/pudding_gate.py')
          gate = gate_path.read_text(encoding='utf-8')
          gate = gate.replace('"simulate", "play"\n', '"simulate", "play", "personalize"\n')
          gate_path.write_text(gate, encoding='utf-8')

          dna_path = Path('references/pudding-dna.md')
          dna = dna_path.read_text(encoding='utf-8')
          needle = 'The corpus validator requires diversity across story families, data strategies, interaction jobs, and interaction modes. This is a deliberate defense against reducing “Pudding-like” to sticky scroll.\n'
          replacement = needle + '\nIt also requires at least one intentionally static reference. The Pudding’s own public resources explicitly note that some static/non-interactive graphics are made with tools such as R, Figma, or Flourish, and their storytelling guide treats static chart sequences as a valid structure. “No interaction” is therefore a first-class design decision, not a lower score.\n'
          if needle not in dna:
              raise SystemExit('dna insertion point not found')
          dna_path.write_text(dna.replace(needle, replacement), encoding='utf-8')
          PY
          rm .github/workflows/patch-static-first.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/pudding-study-corpus.json scripts/pudding_corpus.py tests/test_pudding_corpus.py scripts/pudding_gate.py references/pudding-dna.md .github/workflows/patch-static-first.yml
          git commit -m "feat: make static stories first-class in Pudding study corpus"
          git push origin HEAD:feat/pudding-static-first
