name: Probe WHO mental-health data
on:
  push:
    branches: [story/global-mental-health-capacity-atlas]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe WHO OData
        run: |
          python - <<'PY'
          import json, urllib.request
          urls = {
            'mh4':'https://ghoapi.azureedge.net/api/MH_4?$top=3',
            'mh10':'https://ghoapi.azureedge.net/api/MH_10?$top=3',
            'depression':'https://ghoapi.azureedge.net/api/GDO_q35?$top=3',
            'countries':'https://ghoapi.azureedge.net/api/Dimension/COUNTRY/DimensionValues',
          }
          for name,url in urls.items():
              print('\n###', name, url)
              req=urllib.request.Request(url,headers={'User-Agent':'pudding-skill capacity probe'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data=json.load(r)
                  if isinstance(data,dict) and 'value' in data:
                      print('count sample',len(data['value']))
                      print(json.dumps(data['value'][:3], ensure_ascii=False, indent=2)[:6000])
                  else:
                      print(json.dumps(data,ensure_ascii=False,indent=2)[:6000])
              except Exception as e:
                  print('ERROR',repr(e))
          PY
      - name: Self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/gmh-capacity-probe.yml
          git commit -m 'chore: remove WHO endpoint probe workflow'
          git push
