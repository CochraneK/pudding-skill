name: Fix atlas derived expression
on:
  push:
    branches: [story/global-mental-health-capacity-atlas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix derived syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/stories/global-mental-health/atlas/+page.svelte')
          s=p.read_text()
          old='\t\t.sort((a, b) => (b.metric.median ?? -Infinity) - (a.metric.median ?? -Infinity));\n\t);'
          new='\t\t.sort((a, b) => (b.metric.median ?? -Infinity) - (a.metric.median ?? -Infinity)));'
          assert old in s
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/gmh-atlas-derived-fix.yml
          git add src/routes/stories/global-mental-health/atlas/+page.svelte
          git commit -m 'fix: close atlas derived expression'
          git push
