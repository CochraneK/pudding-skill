name: Apply v2.6 benchmark fixes

on:
  push:
    branches: [feat/v2.6-benchmark]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v2.6-benchmark
          fetch-depth: 0
      - name: Apply benchmark-discovered fixes and docs
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          # 1) Semantic labels must replace field tokens, not letters inside prose.
          path = Path('scripts/candidate_story.py')
          text = path.read_text()
          old = '''        for raw, label in replacements:\n            text = text.replace(raw, label)\n'''
          new = '''        for raw, label in replacements:\n            token_pattern = rf"(?<![A-Za-z0-9_]){re.escape(raw)}(?![A-Za-z0-9_])"\n            text = re.sub(token_pattern, lambda _match, replacement=label: replacement, text)\n'''
          if old not in text:
              raise SystemExit('candidate semantic replacement marker not found')
          path.write_text(text.replace(old, new, 1))

          # 2) group_change candidate specs intentionally use evidence kind `change` for claim recomputation.
          path = Path('scripts/visual_grammar.py')
          text = path.read_text()
          marker = '}\n\n\ndef plan_visual(spec: dict[str, Any]) -> dict[str, Any]:\n'
          replacement = '''}\n\n# group_change candidates store evidence kind `change` because verify_claims recomputes\n# a generic start/end change object. Keep both names mapped to the same editorial grammar.\nGRAMMAR["change"] = GRAMMAR["group_change"]\n\n\ndef plan_visual(spec: dict[str, Any]) -> dict[str, Any]:\n'''
          if marker not in text:
              raise SystemExit('visual grammar marker not found')
          path.write_text(text.replace(marker, replacement, 1))

          # 3) Benchmark story-selection dimension should score the candidate pattern, not evidence serialization kind.
          path = Path('scripts/benchmark.py')
          text = path.read_text()
          old = '''        evidence = list(spec.get("evidence") or [])\n        actual_pattern = str(evidence[0].get("kind")) if evidence else "unknown"\n        insight = str(spec.get("primary_insight", ""))\n'''
          new = '''        evidence = list(spec.get("evidence") or [])\n        selected_id = selection.get("selected_candidate_id")\n        selected_candidate = next((item for item in pool.get("candidates", []) if item.get("id") == selected_id), {})\n        actual_pattern = str(selected_candidate.get("pattern") or (evidence[0].get("kind") if evidence else "unknown"))\n        insight = str(spec.get("primary_insight", ""))\n'''
          if old not in text:
              raise SystemExit('benchmark pattern marker not found')
          path.write_text(text.replace(old, new, 1))

          # 4) Average/ranking fixtures need repeated observations per group so minimum-evidence is meaningful.
          path = Path('benchmarks/corpus.json')
          corpus = json.loads(path.read_text())
          by_id = {case['id']: case for case in corpus['cases']}
          by_id['graduation-ranking-tsv']['rows'] = [
              {'region': region, 'graduation_rate': value}
              for region, values in {
                  'North': [91, 92, 93], 'South': [76, 77, 78],
                  'East': [83, 84, 85], 'West': [68, 69, 70]
              }.items() for value in values
          ]
          rows = []
          row_id = 1
          for zone, values in {'Aster': [94, 95, 96], 'Beryl': [80, 81, 82], 'Cobalt': [72, 73, 74], 'Dune': [65, 66, 67]}.items():
              for value in values:
                  rows.append({'row_id': row_id, 'zone': zone, 'metric': value})
                  row_id += 1
          by_id['semantic-contract-ranking-csv']['rows'] = rows
          path.write_text(json.dumps(corpus, ensure_ascii=False, indent=2) + '\n')

          # 5) README: document the benchmark as a release gate and surface the dashboard.
          path = Path('README.md')
          text = path.read_text()
          if '## v2.6: editorial benchmark and regression corpus' not in text:
              section = '''## v2.6: editorial benchmark and regression corpus\n\nv2.6 adds a curated regression suite so changes to scoring, selection, claim verification, visual grammar, or provenance can be measured across multiple data/story shapes rather than a single demo.\n\n```bash\nnpm run benchmark\n# or\npython scripts/pudding.py benchmark\n```\n\nThe initial corpus contains 12 self-contained cases across CSV, TSV, JSON, JSONL, and NDJSON. It covers divergence, grouped change, ranked means, correlation, distribution, missing values, percentage parsing, ignored identifiers, and explicit semantic contracts. Each case separately scores story selection (35), visual grammar (20), independent claim audit (25), editorial/renderer gate (10), and first-draft provenance (10).\n\nThe committed regression floor is intentionally strict: 100/100 overall, 100% case pass rate, zero hard failures, and 100% pass in every dimension. A claim-audit regression cannot be hidden by a good average. Reports are written to `.qa/benchmark-report.json` and `.qa/benchmark-report.md` and uploaded with CI evidence.\n\nUse `/benchmark` to inspect the corpus and scoring contract. The benchmark is a deterministic regression instrument, **not** a score for newsworthiness, prose craft, causal validity, or visual taste. See `references/benchmark.md`.\n\n'''
              text = text.replace('## v2.5: screenshot-driven visual refinement\n', section + '## v2.5: screenshot-driven visual refinement\n', 1)
          text = text.replace('- `/generated` — the selected deterministic baseline story.\n', '- `/generated` — the selected deterministic baseline story;\n- `/benchmark` — the v2.6 regression corpus and scoring contract.\n')
          text = text.replace('npm run check:skill\nnpm run build\n', 'npm run check:skill\nnpm run benchmark\nnpm run build\n')
          text = text.replace('CI then builds the Svelte app, runs six real-browser delivery cases, stores screenshot/report evidence, and fails on high-or-critical npm advisories.', 'CI then runs the editorial benchmark gate, builds the Svelte app, validates four routes at desktop/mobile widths (8 browser cases), stores benchmark/browser/visual evidence, and fails on high-or-critical npm advisories.')
          path.write_text(text)

          # 6) Skill contract: benchmark regressions before declaring core pipeline changes complete.
          path = Path('SKILL.md')
          text = path.read_text()
          text = text.replace('13. **Refine safely** — apply only bounded automatic fixes; use agent/manual source edits for art direction, then rerun the full browser/visual loop.\n', '13. **Refine safely** — apply only bounded automatic fixes; use agent/manual source edits for art direction, then rerun the full browser/visual loop.\n14. **Benchmark pipeline changes** — when candidate scoring, selection, claim verification, visual grammar, or provenance changes, run the curated regression corpus and explain any expectation change instead of weakening the gate.\n')
          text = text.replace('- `references/visual-refinement-loop.md` for screenshot review and bounded iteration;\n', '- `references/visual-refinement-loop.md` for screenshot review and bounded iteration;\n- `references/benchmark.md` for the v2.6 regression corpus, scoring dimensions, and baseline policy;\n')
          text = text.replace('python scripts/pipeline.py path/to/data.csv --question "What changed?"\n', 'python scripts/pipeline.py path/to/data.csv --question "What changed?"\npython scripts/pudding.py benchmark\n')
          marker = '## Delivery checklist\n\nBefore declaring the story complete:\n'
          if marker in text and 'Run the editorial benchmark (`npm run benchmark`)' not in text:
              text = text.replace('8. Run unit tests (`npm run test:skill`).\n9. Build with `npm run build`.\n', '8. Run unit tests (`npm run test:skill`).\n9. Run the editorial benchmark (`npm run benchmark`) when core pipeline behavior changed.\n10. Build with `npm run build`.\n')
              for old_n, new_n in [(19,20),(18,19),(17,18),(16,17),(15,16),(14,15),(13,14),(12,13),(11,12),(10,11)]:
                  text = text.replace(f'{old_n}. ', f'{new_n}. ', 1)
          path.write_text(text)
          PY
      - name: Commit fixes and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-v26.yml
          git add scripts/candidate_story.py scripts/visual_grammar.py scripts/benchmark.py benchmarks/corpus.json README.md SKILL.md
          git commit -m "fix: resolve benchmark-discovered semantic and visual grammar gaps"
          git push
