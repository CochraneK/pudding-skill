name: Publish v2.3.0 release

on:
  push:
    branches: [release/v2.3.0]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v2.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create v2.3.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target 7c61f1622b74a1e782afe7d751719534a3bf7958 \
            --title "v2.3.0 — Evidence-to-browser editorial delivery" \
            --notes "Pudding-inspired editorial data-storytelling Agent Skill with multi-candidate ranking, semantic data contracts, independent claim auditing, real-browser desktop/mobile QA, screenshot evidence, and dependency hardening. CI verifies 9 regression tests, production build, 6/6 Chromium delivery cases, and blocks high-or-critical npm advisories. Compatible remediation reduced the audit baseline from 16 findings (11 high, 3 moderate, 2 low) to 7 low and 0 moderate/high/critical without destructive force upgrades."
      - name: Remove one-shot publisher from release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-v230-release.yml
          git commit -m "chore: remove one-shot release publisher"
          git push
