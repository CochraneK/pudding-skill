name: Refresh complete WHO capacity data
on:
  push:
    branches: [story/global-mental-health-capacity-atlas]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test and refresh after pagination fixes
        run: |
          python -m unittest tests.test_global_mental_health
          python scripts/mental_health_story.py capacity \
            --output src/data/global-mental-health-capacity.json \
            --audit stories/global-mental-health/research/capacity-audit.json
          python - <<'PY'
          import json
          d=json.load(open('stories/global-mental-health/research/capacity-audit.json'))
          print(json.dumps(d, indent=2))
          assert d['metrics']['psychiatrists_per_100k']['n'] > 100
          assert d['metrics']['depression_prevalence_2015']['n'] > 100
          assert d['mismatch_overlap_n'] > 100
          PY
      - name: Commit refreshed evidence and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/gmh-capacity-refresh-data.yml
          git add src/data/global-mental-health-capacity.json stories/global-mental-health/research/capacity-audit.json
          git commit -m 'data: refresh complete WHO capacity atlas'
          git push
