name: Apply final v2.5 visual polish

on:
  push:
    branches: [refactor/pudding-skill-v2.5]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exclude chart captions from body-copy heuristic and remove stale lab version label
        run: |
          python - <<'PY'
          from pathlib import Path

          probe = Path('scripts/visual_probe.mjs')
          text = probe.read_text(encoding='utf-8')
          old = "!el.closest('footer, nav, aside')"
          new = "!el.closest('footer, nav, aside, .graphic')"
          if old not in text:
              raise SystemExit('visual probe long-form ancestor marker missing')
          probe.write_text(text.replace(old, new, 1), encoding='utf-8')

          lab = Path('src/routes/lab/+page.svelte')
          text = lab.read_text(encoding='utf-8')
          old = '<p class="eyebrow">EDITORIAL LAB · V2.2</p>'
          new = '<p class="eyebrow">EDITORIAL LAB</p>'
          if old not in text:
              raise SystemExit('stale lab label marker missing')
          lab.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v25-final-polish.yml
          git add scripts/visual_probe.mjs src/routes/lab/+page.svelte
          git commit -m "fix: distinguish chart captions from body copy and remove stale lab version"
          git push
