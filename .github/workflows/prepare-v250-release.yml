name: Prepare v2.5.0 release

on:
  push:
    branches: [release/v2.5.0]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bump package metadata
        run: npm version 2.5.0 --no-git-tag-version
      - name: Document v2.5 visual refinement milestone
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          marker = '## v2.4: arbitrary data to publication-ready first draft'
          section = '''## v2.5: screenshot-driven visual refinement\n\nv2.5 extends the data/claim/browser pipeline into a bounded visual self-review loop. It deliberately keeps mechanical browser health, deterministic visual diagnostics, agent screenshot judgment, and automatic refinement as separate evidence layers.\n\nAfter a production build and browser QA, run:\n\n```bash\nnpm run qa:visual-probe -- --base-url http://127.0.0.1:4173 --out .qa/visual-probe.json\npython scripts/pudding.py review .qa/visual-probe.json\n```\n\nThe visual probe evaluates `/`, `/generated`, and `/lab` at desktop and mobile widths and captures both top-of-page and mid-page states, producing **12 screenshots** plus structured metrics. The critic checks measurable properties such as long-form copy measure, leading, heading hierarchy, touch targets, clipping, contrast, visual aspect, and sticky density.\n\nA deterministic `100/100` is still **not** aesthetic approval. `agent_review.status` remains pending until an agent/editor explicitly inspects every required screenshot. `python scripts/pudding.py review-check agent-visual-review.json` verifies screenshot coverage and prevents an agent PASS from overriding a deterministic hard failure.\n\nIf review identifies a low-risk issue, `pudding refine` can only apply three allowlisted changes: readable copy width, text leading, and coarse-pointer target height. It never changes data, claims, chart transforms, arbitrary colors, or Svelte structure, and the automatic loop stops after two passes. Every applied change requires a fresh build, browser QA, visual probe, and before/after screenshot comparison.\n\nThe v2.5 baseline is validated with 21 regression tests, 6/6 browser-delivery cases, 6 visual-probe route/viewport cases, 12 reviewed screenshots, a deterministic visual score of 100/100 with zero findings, and the existing high/critical dependency-audit gate.\n\n'''
          if '## v2.5: screenshot-driven visual refinement' not in text:
              if marker not in text:
                  raise SystemExit('README v2.4 marker not found')
              text = text.replace(marker, section + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v250-release.yml
          git add README.md package.json package-lock.json
          git commit -m "release: prepare v2.5.0"
          git push
