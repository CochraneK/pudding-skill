name: Link mental-health story to atlas
on:
  push:
    branches: [story/global-mental-health-capacity-atlas]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch story CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/routes/stories/global-mental-health/+page.svelte')
          s=p.read_text()
          anchor='\t\t\t\t<code>python scripts/mental_health_story.py who</code>'
          replacement='\t\t\t\t<a class="atlas-link" href="/stories/global-mental-health/atlas">Explore the country capacity atlas →</a>\n'+anchor
          assert anchor in s
          s=s.replace(anchor,replacement,1)
          css='''\n\t.atlas-link { display:inline-flex; min-height:44px; align-items:center; margin:.7rem 0; color:var(--accent); font:800 .82rem/1.2 var(--font-sans); text-decoration-thickness:1px; text-underline-offset:3px; }\n'''
          assert '</style>' in s
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/gmh-story-atlas-link.yml
          git add src/routes/stories/global-mental-health/+page.svelte
          git commit -m 'story: link global mental-health field story to atlas'
          git push
