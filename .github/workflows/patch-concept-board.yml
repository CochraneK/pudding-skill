name: Patch concept board integration

on:
  push:
    branches: [feat/pudding-concept-board]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pudding-concept-board
          fetch-depth: 0
      - name: Wire concept board
        run: |
          python - <<'PY'
          from pathlib import Path

          cli_path = Path('scripts/pudding.py')
          cli = cli_path.read_text(encoding='utf-8')
          function_anchor = '\ndef story(args: argparse.Namespace) -> int:\n'
          concept_function = '''\ndef concept(args: argparse.Namespace) -> int:\n    command = [sys.executable, "scripts/concept_board.py", args.concept_command]\n    if args.concept_command == "init":\n        command += [\n            "--story-id", args.story_id,\n            "--question", args.question,\n            "--argument", args.argument,\n            "--output", str(args.output),\n        ]\n    elif args.concept_command == "validate":\n        command += [\n            str(args.board),\n            "--corpus", str(args.corpus),\n            "--output", str(args.output),\n            "--markdown", str(args.markdown),\n        ]\n    return run(command)\n\n\n'''
          if 'def concept(args:' not in cli:
              if function_anchor not in cli:
                  raise SystemExit('CLI function anchor missing')
              cli = cli.replace(function_anchor, '\n' + concept_function + 'def story(args: argparse.Namespace) -> int:\n', 1)

          parser_anchor = '    inspect_parser = sub.add_parser("inspect", help="profile an arbitrary tabular dataset")\n'
          concept_parser = '''    concept_parser = sub.add_parser("concept", help="build and validate contrasting visual concepts before bespoke implementation")\n    concept_sub = concept_parser.add_subparsers(dest="concept_command", required=True)\n\n    concept_init = concept_sub.add_parser("init", help="create a three-direction concept-board scaffold")\n    concept_init.add_argument("--story-id", required=True)\n    concept_init.add_argument("--question", required=True)\n    concept_init.add_argument("--argument", required=True)\n    concept_init.add_argument("--output", type=Path, default=Path("generated/concept-board.json"))\n    concept_init.set_defaults(func=concept)\n\n    concept_validate = concept_sub.add_parser("validate", help="validate concept contrast, evidence dependencies, mobile/accessibility, and anti-copy guardrails")\n    concept_validate.add_argument("board", type=Path)\n    concept_validate.add_argument("--corpus", type=Path, default=Path("benchmarks/pudding-study-corpus.json"))\n    concept_validate.add_argument("--output", type=Path, default=Path(".qa/concept-board-review.json"))\n    concept_validate.add_argument("--markdown", type=Path, default=Path(".qa/concept-board-review.md"))\n    concept_validate.set_defaults(func=concept)\n\n'''
          if 'concept_parser = sub.add_parser("concept"' not in cli:
              if parser_anchor not in cli:
                  raise SystemExit('CLI parser anchor missing')
              cli = cli.replace(parser_anchor, concept_parser + parser_anchor, 1)
          cli_path.write_text(cli, encoding='utf-8')

          package_path = Path('package.json')
          package = package_path.read_text(encoding='utf-8')
          package = package.replace(
              'python scripts/pudding_corpus.py validate && python scripts/qa_story.py --root .',
              'python scripts/pudding_corpus.py validate && python scripts/concept_board.py validate stories/global-mental-health/concept-board.json && python scripts/qa_story.py --root .'
          )
          if '"pudding:concept"' not in package:
              package = package.replace(
                  '"pudding:study": "python scripts/pudding_corpus.py report",',
                  '"pudding:study": "python scripts/pudding_corpus.py report",\n\t\t"pudding:concept": "python scripts/concept_board.py",'
              )
          package_path.write_text(package, encoding='utf-8')

          skill_path = Path('SKILL.md')
          skill = skill_path.read_text(encoding='utf-8')
          skill = skill.replace(
              '8. **Choose visual grammar** — recommend the best editorial form while preserving a deterministic baseline renderer.\n9. **Verify claims independently**',
              '8. **Contrast concepts** — before bespoke implementation, develop and validate at least three structurally different concepts, including a static/no-interaction alternative. Prototype the hardest claim-bearing moments before selecting a form.\n9. **Choose visual grammar** — recommend the best editorial form while preserving a deterministic baseline renderer.\n10. **Verify claims independently**'
          )
          for old, new in [
              ('10. **Generate a first-draft package**', '11. **Generate a first-draft package**'),
              ('11. **Implement and inspect**', '12. **Implement and inspect**'),
              ('12. **Validate delivery**', '13. **Validate delivery**'),
              ('13. **Review screenshots**', '14. **Review screenshots**'),
              ('14. **Refine safely**', '15. **Refine safely**'),
              ('15. **Benchmark pipeline changes**', '16. **Benchmark pipeline changes**'),
          ]:
              skill = skill.replace(old, new)
          read_anchor = '- `references/visual-grammar.md` for visual selection;\n'
          if '- `references/concept-board.md`' not in skill:
              skill = skill.replace(read_anchor, '- `references/concept-board.md` after evidence supports the argument and before bespoke visual implementation;\n' + read_anchor)
          section_anchor = '## Research-first workflow\n'
          concept_section = '''## Contrastive concept board\n\nOnce research/data audit supports the argument, do not code the first plausible visual. Create a concept board with `python scripts/pudding.py concept init ...`, develop at least three complete directions, then run `python scripts/pudding.py concept validate generated/concept-board.json`. One direction must be a serious static/no-interaction alternative. A passing result is `READY_FOR_PROTOTYPE`, never automatic selection. Read `references/concept-board.md` for the contract and prototype-review criteria.\n\n'''
          if '## Contrastive concept board\n' not in skill:
              skill = skill.replace(section_anchor, concept_section + section_anchor, 1)
          skill_path.write_text(skill, encoding='utf-8')
          PY
          rm .github/workflows/patch-concept-board.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/pudding.py package.json SKILL.md .github/workflows/patch-concept-board.yml
          git commit -m "feat: wire contrastive concept board into workflow"
          git push origin HEAD:feat/pudding-concept-board
