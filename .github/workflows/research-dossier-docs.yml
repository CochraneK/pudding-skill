name: Research dossier docs patch

on:
  push:
    branches: [feat/research-dossier]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/research-dossier
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch SKILL and README
        run: |
          python - <<'PY'
          from pathlib import Path

          skill = Path('SKILL.md')
          text = skill.read_text(encoding='utf-8')
          old = 'description: Turn a research question and structured dataset into an evidence-audited editorial web story, publication-ready first draft, and screenshot-reviewed visual experience. Use for Pudding-inspired data journalism, scrollytelling, annotated charts, interactive explainers, narrative visualization, or data-story prototyping in Svelte.'
          new = 'description: Turn a domain or industry question into an auditable research dossier when data is missing, then turn trustworthy structured evidence into an editorial web story, publication-ready first draft, and screenshot-reviewed visual experience. Use for industry research, source and numeric-evidence audits, data acquisition planning, Pudding-inspired data journalism, scrollytelling, annotated charts, interactive explainers, narrative visualization, or data-story prototyping in Svelte.'
          if old not in text:
              raise SystemExit('SKILL description anchor not found')
          text = text.replace(old, new, 1)

          old = 'Build **Pudding-inspired editorial data stories**, not visual clones of The Pudding. Reproduce the useful reasoning pattern: question → evidence → competing story directions → editorial choice → visual grammar → independently verified claims → first draft → implementation → browser verification → screenshot review → bounded refinement.'
          new = 'Build **Pudding-inspired editorial data stories**, not visual clones of The Pudding. When trustworthy structured data does not yet exist, first build an auditable research dossier. Reproduce the useful reasoning pattern: question → research dossier when needed → evidence → competing story directions → editorial choice → visual grammar → independently verified claims → first draft → implementation → browser verification → screenshot review → bounded refinement.'
          if old not in text:
              raise SystemExit('SKILL intro anchor not found')
          text = text.replace(old, new, 1)

          old = 'Use this sequence:\n\n1. **Audit input**'
          new = 'Use this sequence:\n\n0. **Research when data is missing** — if the input is a domain/industry question rather than a trustworthy dataset, build a research dossier first: definitions → source map → primary evidence → numeric claims → conflict resolution → data acquisition plan. Do not invent a dataset to skip this step.\n1. **Audit input**'
          if old not in text:
              raise SystemExit('SKILL sequence anchor not found')
          text = text.replace(old, new, 1)

          old = 'Read:\n\n- `references/editorial-workflow.md`'
          new = 'Read:\n\n- `references/research-dossier.md` when the user starts with a topic/question but lacks a trustworthy dataset;\n- `references/editorial-workflow.md`'
          if old not in text:
              raise SystemExit('SKILL references anchor not found')
          text = text.replace(old, new, 1)

          anchor = '## Preferred structured-data workflow\n'
          research = '''## Research-first workflow\n\nUse this when the user has a topic or industry question but no reliable structured dataset yet. The Agent performs the browsing/retrieval; the deterministic module records provenance and compiles the handoff.\n\n```bash\npython scripts/pudding.py research init \\\n  --topic "Global mental health" \\\n  --question "Where does treatment capacity lag behind need?"\n\n# After the agent populates sources, claims, conflicts, and data targets:\npython scripts/pudding.py research validate generated/research/research-dossier.json\npython scripts/pudding.py research compile generated/research/research-dossier.json\n```\n\nThe compiled research package contains `research-report.md`, `source-ledger.json`, `numeric-evidence.csv`, `data-acquisition-plan.md`, and the canonical `research-dossier.json`. Only VERIFIED and QUALIFIED numeric claims enter `numeric-evidence.csv`; conflict/lead-only/rejected figures remain visible but cannot silently become story input.\n\nA material numeric claim should carry its value, unit, geography, period, population/denominator, source IDs, locator (page/table/figure/query), definition/method note, uncertainty when available, license note, status, and confidence. Prefer primary sources and preserve query parameters for dynamic data tools.\n\n'''
          if anchor not in text:
              raise SystemExit('SKILL workflow anchor not found')
          text = text.replace(anchor, research + anchor, 1)
          skill.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          anchor = '## v2.6: editorial benchmark and regression corpus\n'
          section = '''## Research dossier mode: from a question to auditable evidence\n\n`pudding-skill` no longer has to start with a ready-made CSV. When a project starts with an industry/domain question, use the research dossier workflow to map definitions, papers, official reports, white papers, manuals, source conflicts, numeric claims, licensing constraints, and concrete data-acquisition steps before entering the story pipeline.\n\n```bash\npython scripts/pudding.py research init --topic "Global mental health" --question "Where does treatment capacity lag behind need?"\npython scripts/pudding.py research validate generated/research/research-dossier.json\npython scripts/pudding.py research compile generated/research/research-dossier.json\n```\n\nCompilation produces an executable research package: `research-report.md`, `source-ledger.json`, `numeric-evidence.csv`, and `data-acquisition-plan.md`. Material numbers retain source and scope metadata; unresolved conflicts and discovery-only figures are kept out of story-ready numeric evidence. See `references/research-dossier.md`.\n\n'''
          if anchor not in r:
              raise SystemExit('README v2.6 anchor not found')
          r = r.replace(anchor, section + anchor, 1)
          readme.write_text(r, encoding='utf-8')
          PY
      - name: Self-delete workflow and commit docs
        run: |
          git rm .github/workflows/research-dossier-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SKILL.md README.md
          git commit -m 'docs: integrate research-first workflow'
          git push origin HEAD:feat/research-dossier
