name: One-shot Pages base-path patch

on:
  push:
    branches: [feat/github-pages-report-hub]
    paths:
      - .github/workflows/one-shot-base-path.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/github-pages-report-hub
      - name: Rewrite root-relative Svelte links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('src')
          changed = []
          pattern = re.compile(r'(?P<attr>href|src)="/(?P<path>[^"{]*)"')
          base_expr = '$' + '{base}'

          for path in root.rglob('*.svelte'):
              text = path.read_text(encoding='utf-8')
              if not pattern.search(text):
                  continue

              if "from '$app/paths'" not in text and 'from "$app/paths"' not in text:
                  script = re.search(r'<script(?:\s+[^>]*)?>', text)
                  if script:
                      insert_at = script.end()
                      text = text[:insert_at] + "\n\timport { base } from '$app/paths';" + text[insert_at:]
                  else:
                      text = "<script>\n\timport { base } from '$app/paths';\n</script>\n\n" + text

              text = pattern.sub(
                  lambda m: f'{m.group("attr")}={{`{base_expr}/{m.group("path")}`}}',
                  text
              )
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('rewritten:', *changed, sep='\n- ')

          leftovers = []
          for path in root.rglob('*.svelte'):
              text = path.read_text(encoding='utf-8')
              for match in pattern.finditer(text):
                  leftovers.append(f'{path}: {match.group(0)}')
          if leftovers:
              raise SystemExit('root-relative links remain:\n' + '\n'.join(leftovers))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-base-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows/one-shot-base-path.yml
          git commit -m "fix: make internal links GitHub Pages aware"
          git push origin HEAD:feat/github-pages-report-hub
